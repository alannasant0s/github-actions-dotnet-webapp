name: .NET Build Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'
        
    - name: Find and list .NET projects
      id: find-projects
      run: |
        # Encontra o primeiro arquivo .csproj ou .sln
        PROJECT_FILE=$(find . -name "*.csproj" -o -name "*.sln" | head -n 1)
        if [ -z "$PROJECT_FILE" ]; then
          echo "::error::Nenhum arquivo .csproj ou .sln encontrado!"
          exit 1
        fi
        echo "PROJECT_FILE=${PROJECT_FILE}" >> $GITHUB_OUTPUT
        echo "📌 Arquivo de projeto encontrado: ${PROJECT_FILE}"
        
    - name: Build
      run: dotnet build "${{ steps.find-projects.outputs.PROJECT_FILE }}" --configuration Release