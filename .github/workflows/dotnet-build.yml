name: .NET Build Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'  # Altere conforme necessário
        
    - name: Find and validate .NET projects
      id: find-projects
      run: |
        echo "### Procurando projetos .NET ###"
        # Corrigido: usando * em vez de **
        PROJECTS=$(find . -name "*.csproj" -o -name "*.sln" | grep . || true)
        
        if [ -z "$PROJECTS" ]; then
          echo "::error::Nenhum projeto .NET encontrado!"
          echo "Estrutura do repositório:"
          ls -R
          exit 1
        fi
        
        echo "Projetos encontrados:"
        echo "$PROJECTS"
        echo "projects=${PROJECTS}" >> $GITHUB_OUTPUT
        
    - name: Build all projects
      run: |
        # Itera sobre todos os projetos encontrados
        while IFS= read -r project; do
          echo "🏗️ Building $project"
          dotnet build "$project" --configuration Release
        done <<< "${{ steps.find-projects.outputs.projects }}"