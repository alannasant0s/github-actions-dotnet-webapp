name: .NET Build Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'  # Altere para sua versão
        
    - name: List project files (Debug)
      run: |
        echo "Estrutura do projeto:"
        ls -R
        echo ""
        echo "Arquivos .NET encontrados:"
        find . -name "*.csproj" -o -name "*.sln"
        
    - name: Build
      run: |
        # Substitua pelo caminho do SEU arquivo .csproj ou .sln
        dotnet build ./src/YourProject/YourProject.csproj --configuration