name: .NET 8.0 Build Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 8.x SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'  # Versão explicitamente definida
        
    - name: List SDKs instalados
      run: dotnet --list-sdks
      
    - name: Build
      run: dotnet build --configuration Release