name: Build .NET

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
        
    - name: Find projects
      id: find
      run: |
        files=$(find . -name "*.csproj" -o -name "*.sln")
        echo "$files" | tee found.txt
        echo "files=${files}" >> $GITHUB_OUTPUT
        
    - name: Run build
      run: |
        while read -r proj; do
          dotnet build "$proj" -c Release
        done < found.txt