name: .NET Build Workflow

# SEÇÃO ON CORRETA - DEFINA PELO MENOS 1 TRIGGER
on:
  # Trigger para push na branch main
  push:
    branches: [ "main" ]
  
  # Trigger agendado (opcional)
  schedule:
    - cron: '30 * * * *'  # Executa no minuto 30 de cada hora

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'
        
    - name: Build
      run: dotnet build --configuration Release